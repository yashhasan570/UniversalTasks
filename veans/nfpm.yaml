name: "veans"
arch: "<arch>"
platform: "linux"
version: "<version>"
description: "veans is an agent-friendly CLI wrapper for the Universal Tasks REST API."
maintainer: "Universal Tasks Maintainers <maintainers@universaltasks.io>"
homepage: "https://universaltasks.io"
section: "default"
priority: "extra"
license: "AGPLv3"
rpm:
  signature:
    key_file: ${NFPM_GPG_KEY_FILE}
contents:
  - src: <binlocation>
    dst: /usr/local/bin/veans
